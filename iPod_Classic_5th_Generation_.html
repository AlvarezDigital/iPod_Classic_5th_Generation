                    renderEmptyLibraryPrompt(lcdBody, "Cover Flow Empty", "Add your local music folders or single songs to browse album covers.");
                    return;
                }

                const sel = view.selectedIndex;
                const currentAlb = view.albums[sel];
                let cardsHtml = "";

                // Render visible range around selected album
                for (let i = Math.max(0, sel - 3); i <= Math.min(view.albums.length - 1, sel + 3); i++) {
                    const offset = i - sel;
                    const alb = view.albums[i];
                    let transform = "";
                    let zIndex = 10 - Math.abs(offset);
                    let opacity = 1;

                    if (offset === 0) {
                        transform = "translateX(0px) scale(1.06) rotateY(0deg)";
                    } else if (offset < 0) {
                        const x = -54 + (offset + 1) * 24;
                        transform = `translateX(${x}px) scale(0.78) rotateY(48deg)`;
                        opacity = 0.88;
                    } else {
                        const x = 54 + (offset - 1) * 24;
                        transform = `translateX(${x}px) scale(0.78) rotateY(-48deg)`;
                        opacity = 0.88;
                    }

                    cardsHtml += `
                        <div class="cf-card" data-index="${i}" style="transform: ${transform}; z-index: ${zIndex}; opacity: ${opacity};">
                            <img src="${alb.coverUrl}" alt="">
                        </div>
                    `;
                }

                lcdBody.innerHTML = `
                    <div class="coverflow-view">
                        <div class="coverflow-stage">${cardsHtml}</div>
                        <div class="cf-meta">
                            <div class="cf-album-title">${escapeHtml(currentAlb.title)}</div>
                            <div class="cf-album-artist">${escapeHtml(currentAlb.artist)} (${sel + 1} of ${view.albums.length})</div>
                        </div>
                    </div>
                `;

                lcdBody.querySelectorAll(".cf-card").forEach(card => {
                    card.addEventListener("click", () => {
                        const idx = parseInt(card.dataset.index, 10);
                        if (idx === view.selectedIndex) {
                            handleCenterSelect();
                        } else {
                            view.selectedIndex = idx;
                            clickSound.playClick();
                            renderScreen();
                        }
                    });
                });
                return;
            }

            if (view.type === "artists") {
                if (view.artists.length === 0) {
                    renderEmptyLibraryPrompt(lcdBody, "No Artists Loaded", "Add local music folders or single songs from your computer.");
                    return;
                }

                lcdBody.innerHTML = `
                    <div class="menu-list" id="menuListContainer">
                        ${view.artists.map((art, i) => `
                            <div class="menu-item ${i === view.selectedIndex ? "selected" : ""}" data-index="${i}">
                                <span class="menu-item-label">${escapeHtml(art.name)}</span>
                                <span class="text-[10px] opacity-75">${art.albums.length} alb</span>
                                <span class="menu-chevron">&rsaquo;</span>
                            </div>
                        `).join("")}
                    </div>
                `;
                bindMenuListClicks();
                scrollSelectedIntoView();
                return;
            }

            if (view.type === "album_tracks") {
                const tracks = view.album.tracks;
                lcdBody.innerHTML = `
                    <div class="menu-list" id="menuListContainer">
                        ${tracks.map((trk, i) => {
                            const trackNumDisplay = trk.track !== 999 ? `${trk.track}. ` : `${i + 1}. `;
                            const isCurrentPlaying =
                                state.queue[state.queueIndex] && state.queue[state.queueIndex].id === trk.id;
                            return `
                                <div class="menu-item ${i === view.selectedIndex ? "selected" : ""}" data-index="${i}">
                                    <span class="menu-item-label">${escapeHtml(trackNumDisplay + trk.title)}</span>
                                    ${isCurrentPlaying ? `<span class="text-[10px] font-bold">&#9835;</span>` : ""}
                                </div>
                            `;
                        }).join("")}
                    </div>
                `;
                bindMenuListClicks();
                scrollSelectedIntoView();
                return;
            }

            if (view.type === "songs") {
                if (state.tracks.length === 0) {
                    renderEmptyLibraryPrompt(lcdBody, "No Songs Loaded", "Add folders or single audio files from your computer.");
                    return;
                }

                lcdBody.innerHTML = `
                    <div class="menu-list" id="menuListContainer">
                        ${state.tracks.map((trk, i) => `
                            <div class="menu-item ${i === view.selectedIndex ? "selected" : ""}" data-index="${i}">
                                <span class="menu-item-label">${escapeHtml(trk.title)}</span>
                                <span class="text-[10px] opacity-70 truncate max-w-[75px]">${escapeHtml(trk.artist)}</span>
                            </div>
                        `).join("")}
                    </div>
                `;
                bindMenuListClicks();
                scrollSelectedIntoView();
                return;
            }

            if (view.type === "now_playing") {
                const trk = state.queue[state.queueIndex];
                if (!trk) {
                    popView();
                    return;
                }

                lcdBody.innerHTML = `
                    <div class="now-playing-view">
                        <div class="np-top-meta">
                            <span>${state.queueIndex + 1} of ${state.queue.length}</span>
                            <span class="truncate max-w-[145px] text-right">${escapeHtml(trk.album)}</span>
                        </div>

                        <div class="np-main-split">
                            <div class="np-art-wrapper">
                                <img id="npCoverImg" src="${trk.coverUrl}" alt="Album Art">
                            </div>

                            <div class="np-track-details">
                                <div class="np-title">${escapeHtml(trk.title)}</div>
                                <div class="np-artist">${escapeHtml(trk.artist)}</div>
                                <div class="np-album">${escapeHtml(trk.album)}</div>
                            </div>
                        </div>

                        <div class="np-bottom-bar" id="npBottomBar">
                            <!-- Scrubber or Volume Bar -->
                        </div>
                    </div>
                `;
                renderNowPlayingBottom();
            }
        }

        function renderNowPlayingBottom() {
            const container = document.getElementById("npBottomBar");
            if (!container) return;

            if (state.showVolumeBar) {
                const pct = Math.round(state.volume * 100);
                container.innerHTML = `
                    <div class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-slate-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217z"/>
                        </svg>
                        <div class="scrubber-track flex-1">
                            <div class="volume-fill" style="width: ${pct}%"></div>
                        </div>
                        <svg class="w-4 h-4 text-slate-700 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414z"/>
                        </svg>
                    </div>
                    <div class="scrubber-times">
                        <span>Volume</span>
                        <span>${pct}%</span>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="scrubber-track" id="scrubberTrack" title="Click to seek">
                        <div class="scrubber-fill" id="scrubberFill"></div>
                    </div>
                    <div class="scrubber-times">
                        <span id="timeElapsed">0:00</span>
                        <span id="timeRemaining">-0:00</span>
                    </div>
                `;

                const trackEl = document.getElementById("scrubberTrack");
                if (trackEl) {
                    trackEl.addEventListener("click", (e) => {
                        if (!isFinite(audioEl.duration) || audioEl.duration <= 0) return;
                        const rect = trackEl.getBoundingClientRect();
                        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                        audioEl.currentTime = ratio * audioEl.duration;
                        renderNowPlayingProgress();
                    });
                }
                renderNowPlayingProgress();
            }
        }

        function renderNowPlayingProgress() {
            const fill = document.getElementById("scrubberFill");
            const elapsedEl = document.getElementById("timeElapsed");
            const remEl = document.getElementById("timeRemaining");
            if (!fill || !elapsedEl || !remEl) return;

            const cur = audioEl.currentTime || 0;
            const dur = audioEl.duration || 0;
            const pct = dur > 0 ? Math.min(100, (cur / dur) * 100) : 0;

            fill.style.width = `${pct}%`;
            elapsedEl.textContent = formatTime(cur);
            remEl.textContent = dur > 0 ? `-${formatTime(Math.max(0, dur - cur))}` : "-0:00";
        }

        function renderEmptyLibraryPrompt(container, heading, subtitle) {
            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-4 text-center bg-white">
                    <div class="w-9 h-9 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-center text-blue-600 mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
                        </svg>
                    </div>
                    <div class="text-xs font-bold text-slate-900">${escapeHtml(heading)}</div>
                    <div class="text-[10.5px] text-slate-500 mt-1 leading-snug">${escapeHtml(subtitle)}</div>
                    <div class="mt-3 flex items-center justify-center gap-2">
                        <button id="emptyPromptFolderBtn" class="px-2.5 py-1 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-[10.5px] font-semibold shadow cursor-pointer">
                            Add Folder
                        </button>
                        <button id="emptyPromptFilesBtn" class="px-2.5 py-1 rounded-full bg-slate-700 hover:bg-slate-800 text-white text-[10.5px] font-semibold shadow cursor-pointer">
                            Add Songs
                        </button>
                    </div>
                </div>
            `;
            const folderBtn = document.getElementById("emptyPromptFolderBtn");
            if (folderBtn) {
                folderBtn.addEventListener("click", () => document.getElementById("folderInput").click());
            }
            const filesBtn = document.getElementById("emptyPromptFilesBtn");
            if (filesBtn) {
                filesBtn.addEventListener("click", () => document.getElementById("filesInput").click());
            }
        }

        function bindMenuListClicks() {
            const items = document.querySelectorAll("#menuListContainer .menu-item");
            items.forEach(item => {
                item.addEventListener("click", () => {
                    const idx = parseInt(item.dataset.index, 10);
                    const view = currentView();
                    view.selectedIndex = idx;
                    handleCenterSelect();
                });
            });
        }

        function scrollSelectedIntoView() {
            const container = document.getElementById("menuListContainer");
            if (!container) return;
            const selected = container.querySelector(".menu-item.selected");
            if (selected) {
                selected.scrollIntoView({ block: "nearest" });
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // ==========================================
        // 10. TACTILE CLICK WHEEL ROTATION & BUTTONS
        // ==========================================
        (function setupClickWheelInteractions() {
            const wheel = document.getElementById("clickWheel");
            const centerBtn = document.getElementById("btnCenter");
            const btnMenu = document.getElementById("btnMenu");
            const btnPrev = document.getElementById("btnPrev");
            const btnNext = document.getElementById("btnNext");
            const btnPlayPause = document.getElementById("btnPlayPause");

            let activePointerId = null;
            let isDraggingWheel = false;
            let pressedButton = null;
            let startX = 0;
            let startY = 0;
            let lastAngle = null;
            let accumulatedAngle = 0;
            let totalAngularTravel = 0;
            let didRotateDuringGesture = false;
            let wheelScrollAccum = 0;

            const STEP_DEGREES = 14;         // Smooth, responsive degrees per menu tick
            const DEADZONE_RADIUS = 18;      // Ignore jitter right at the exact center pivot
            const DRAG_PIXEL_THRESHOLD = 6;  // Pixels moved before converting a tap into a wheel scroll

            function getWheelGeometry(clientX, clientY) {
                const rect = wheel.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = clientX - cx;
                const dy = clientY - cy;
                const radius = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                return { radius, angle, maxRadius: rect.width / 2 };
            }

            function isInsideCenterButton(clientX, clientY) {
                const rect = centerBtn.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                return Math.hypot(clientX - cx, clientY - cy) <= rect.width / 2;
            }

            function getQuadrantButtonAt(target) {
                if (!target || !target.closest) return null;
                return target.closest(".wheel-btn");
            }

            function triggerQuadrantAction(btn) {
                if (!btn) return;
                clickSound.playClick();
                if (btn === btnMenu) {
                    popView();
                } else if (btn === btnPrev) {
                    if (currentView().type === "coverflow") {
                        handleWheelScroll(-1);
                    } else {
                        playPrevTrack();
                    }
                } else if (btn === btnNext) {
                    if (currentView().type === "coverflow") {
                        handleWheelScroll(1);
                    } else {
                        playNextTrack();
                    }
                } else if (btn === btnPlayPause) {
                    togglePlayPause();
                }
            }

            // Capture-phase click blocker ensures native browser 'click' events NEVER fire
            // on MENU / Prev / Next / Play-Pause; taps are handled cleanly in pointerup instead.
            wheel.addEventListener("click", (e) => {
                if (e.target.closest(".wheel-btn")) {
                    e.stopPropagation();
                    e.preventDefault();
                }
            }, true);

            // Unified Pointer Events: handles both clean quadrant taps and full-ring circular scrolling
            wheel.addEventListener("pointerdown", (e) => {
                if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;
                if (isInsideCenterButton(e.clientX, e.clientY)) return;

                const geom = getWheelGeometry(e.clientX, e.clientY);
                if (geom.radius < DEADZONE_RADIUS) return;

                activePointerId = e.pointerId;
                isDraggingWheel = true;
                pressedButton = getQuadrantButtonAt(e.target);
                if (pressedButton) pressedButton.classList.add("pressed");

                startX = e.clientX;
                startY = e.clientY;
                didRotateDuringGesture = false;
                accumulatedAngle = 0;
                totalAngularTravel = 0;
                lastAngle = geom.angle;

                try {
                    wheel.setPointerCapture(e.pointerId);
                } catch (err) {}
            });

            wheel.addEventListener("pointermove", (e) => {
                if (!isDraggingWheel || e.pointerId !== activePointerId || lastAngle === null) return;
                if (e.cancelable) e.preventDefault();

                const geom = getWheelGeometry(e.clientX, e.clientY);
                if (geom.radius < DEADZONE_RADIUS) return;

                let delta = geom.angle - lastAngle;
                if (delta > 180) delta -= 360;
                if (delta < -180) delta += 360;

                // Ignore extreme single-frame angle spikes if cursor crosses close to center
                if (Math.abs(delta) > 95) {
                    lastAngle = geom.angle;
                    return;
                }

                const movedDist = Math.hypot(e.clientX - startX, e.clientY - startY);
                totalAngularTravel += Math.abs(delta);
                accumulatedAngle += delta;
                lastAngle = geom.angle;

                // Once finger/cursor moves beyond tap jitter, lock into scroll mode & release button visual state
                if (!didRotateDuringGesture && (movedDist >= DRAG_PIXEL_THRESHOLD || totalAngularTravel >= 5)) {
                    didRotateDuringGesture = true;
                    if (pressedButton) {
                        pressedButton.classList.remove("pressed");
                        pressedButton = null;
                    }
                }

                // Velocity-adaptive step: faster circular swipes scroll smoothly through long lists
                const absAccum = Math.abs(accumulatedAngle);
                const effectiveStep = absAccum > STEP_DEGREES * 3 ? STEP_DEGREES * 0.72 : STEP_DEGREES;

                while (Math.abs(accumulatedAngle) >= effectiveStep) {
                    didRotateDuringGesture = true;
                    if (pressedButton) {
                        pressedButton.classList.remove("pressed");
                        pressedButton = null;
                    }
                    if (accumulatedAngle > 0) {
                        handleWheelScroll(1);
                        accumulatedAngle -= effectiveStep;
                    } else {
                        handleWheelScroll(-1);
                        accumulatedAngle += effectiveStep;
                    }
                }
            });

            function finishWheelGesture(e) {
                if (!isDraggingWheel) return;
                if (e && activePointerId !== null && e.pointerId !== activePointerId) return;

                const wasDrag = didRotateDuringGesture;
                const tappedBtn = pressedButton;

                if (pressedButton) {
                    pressedButton.classList.remove("pressed");
                }

                if (activePointerId !== null) {
                    try {
                        if (wheel.hasPointerCapture(activePointerId)) {
                            wheel.releasePointerCapture(activePointerId);
                        }
                    } catch (err) {}
                }

                activePointerId = null;
                isDraggingWheel = false;
                pressedButton = null;
                lastAngle = null;
                accumulatedAngle = 0;
                totalAngularTravel = 0;

                // Only trigger quadrant button action if pointer was released without scrolling
                // and stayed over that quadrant button
                if (!wasDrag && tappedBtn && e && e.type === "pointerup") {
                    const rect = tappedBtn.getBoundingClientRect();
                    const insideBtn =
                        e.clientX >= rect.left - 6 &&
                        e.clientX <= rect.right + 6 &&
                        e.clientY >= rect.top - 6 &&
                        e.clientY <= rect.bottom + 6;
                    if (insideBtn) {
                        triggerQuadrantAction(tappedBtn);
                    }
                }
            }

            wheel.addEventListener("pointerup", finishWheelGesture);
            wheel.addEventListener("pointercancel", finishWheelGesture);

            // Smooth trackpad & mouse wheel scrolling over the iPod with delta accumulation
            document.getElementById("ipodDevice").addEventListener("wheel", (e) => {
                e.preventDefault();
                const rawDelta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                // Normalize line/page wheel modes vs pixel trackpad deltas
                const normalized = e.deltaMode === 1 ? rawDelta * 28 : (e.deltaMode === 2 ? rawDelta * 120 : rawDelta);
                wheelScrollAccum += normalized;

                const THRESHOLD = 24;
                while (Math.abs(wheelScrollAccum) >= THRESHOLD) {
                    if (wheelScrollAccum > 0) {
                        handleWheelScroll(1);
                        wheelScrollAccum -= THRESHOLD;
                    } else {
                        handleWheelScroll(-1);
                        wheelScrollAccum += THRESHOLD;
                    }
                }
            }, { passive: false });

            // Center button stops propagation so clicking Select never starts a wheel drag
            centerBtn.addEventListener("pointerdown", (e) => {
                e.stopPropagation();
            });

            centerBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                handleCenterSelect();
            });
        })();

        // ==========================================
        // 11. KEYBOARD SHORTCUTS & DRAG-AND-DROP
        // ==========================================
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                handleWheelScroll(1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                handleWheelScroll(-1);
            } else if (e.key === "Enter") {
                e.preventDefault();
                handleCenterSelect();
            } else if (e.key === "Escape" || e.key === "Backspace") {
                e.preventDefault();
                clickSound.playClick();
                popView();
            } else if (e.key === "ArrowRight") {
                e.preventDefault();
                clickSound.playClick();
                if (currentView().type === "coverflow") handleWheelScroll(1);
                else playNextTrack();
            } else if (e.key === "ArrowLeft") {
                e.preventDefault();
                clickSound.playClick();
                if (currentView().type === "coverflow") handleWheelScroll(-1);
                else playPrevTrack();
            } else if (e.key === " ") {
                e.preventDefault();
                clickSound.playClick();
                togglePlayPause();
            }
        });

        // File Inputs
        document.getElementById("folderInput").addEventListener("change", (e) => {
            handleSelectedFiles(e.target.files);
            e.target.value = "";
        });
        document.getElementById("filesInput").addEventListener("change", (e) => {
            handleSelectedFiles(e.target.files);
            e.target.value = "";
        });

        // Drag & Drop support onto iPod Device (supports unlimited single files, multiple files, and nested directories)
        const ipodDevice = document.getElementById("ipodDevice");
        ipodDevice.addEventListener("dragover", (e) => {
            e.preventDefault();
            ipodDevice.classList.add("drag-over");
        });
        ipodDevice.addEventListener("dragleave", () => {
            ipodDevice.classList.remove("drag-over");
        });
        ipodDevice.addEventListener("drop", async (e) => {
            e.preventDefault();
            ipodDevice.classList.remove("drag-over");

            if (e.dataTransfer.items) {
                const collectedFiles = [];
                const traverseEntry = async (entry, path = "") => {
                    if (entry.isFile) {
                        await new Promise(resolve => {
                            entry.file(file => {
                                Object.defineProperty(file, "webkitRelativePath", {
                                    value: path + file.name
                                });
                                collectedFiles.push(file);
                                resolve();
                            }, () => resolve());
                        });
                    } else if (entry.isDirectory) {
                        const reader = entry.createReader();
                        // Loop readEntries until empty array is returned (handles folders with >100 files)
                        let allEntries = [];
                        while (true) {
                            const batch = await new Promise(resolve => {
                                reader.readEntries(res => resolve(res), () => resolve([]));
                            });
                            if (!batch || batch.length === 0) break;
                            allEntries = allEntries.concat(batch);
                        }
                        for (const child of allEntries) {
                            await traverseEntry(child, path + entry.name + "/");
                        }
                    }
                };

                const items = Array.from(e.dataTransfer.items);
                for (const item of items) {
                    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                    if (entry) {
                        await traverseEntry(entry, "");
                    } else if (item.kind === "file") {
                        const f = item.getAsFile();
                        if (f) collectedFiles.push(f);
                    }
                }
                if (collectedFiles.length > 0) {
                    handleSelectedFiles(collectedFiles);
                    return;
                }
            }

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleSelectedFiles(e.dataTransfer.files);
            }
        });

        // Initialize iPod on Load
        window.onload = function () {
            resetToMainMenu();
        };
    </script>
</body>
</html>
